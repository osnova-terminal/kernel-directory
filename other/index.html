<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTHERGRADE // NOTCH FIELD</title>
<style>
  :root{
    --black:#000000; --fg:#ffffff; --dim:#7f7f7f; --dimmer:#3c3c3c; --line:#4a4a4a;
    --cyan:#5be3ff; --grn:#7cffb0; --amber:#ffcf7c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#000;height:100%;overflow-x:hidden;}
  body{font-family:"Courier New",Courier,monospace;color:var(--fg);}
  ::selection{background:#fff;color:#000;}

  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    background:#000;
    overflow:hidden;
  }
  .dust{position:absolute; inset:0; pointer-events:none;}
  .dust i{
    position:absolute;
    width:2px;height:2px;
    background:#fff;
    border-radius:50%;
    animation:twinkle var(--dur) ease-in-out infinite;
    animation-delay:var(--delay);
    opacity:.2;
  }
  @keyframes twinkle{0%,100%{opacity:.08;} 50%{opacity:.7;}}

  /* ===== TOP HUD ===== */
  .hud-top{
    position:relative; z-index:3;
    display:flex; justify-content:space-between; align-items:baseline;
    padding:16px 20px;
    font-size:11px; letter-spacing:.1em; color:var(--dim);
    border-bottom:1px solid #161616;
  }
  .hud-top b{color:var(--fg); font-weight:normal;}
  .hud-title{font-family:"Times New Roman",serif; font-size:15px; letter-spacing:.3em; color:var(--fg);}

  /* ===== FIELD (svg constellation) ===== */
  .field-wrap{position:relative; z-index:2; width:100%; margin:0 auto;}
  svg.field{width:100%; height:auto; display:block;}

  .lead{stroke:var(--dimmer); stroke-width:.8; fill:none;}
  .lead.dashed{stroke-dasharray:3 4;}
  .lead.lit{stroke:var(--fg); opacity:.6;}
  .lead.kalma-lead{stroke:var(--grn); opacity:.75;}
  .lead.link{stroke:#1c1c1c; stroke-width:.7;}
  .lead.link.lit{stroke:var(--fg); opacity:.35;}

  /* card boxes, rendered via foreignObject */
  .card{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:6px; box-sizing:border-box;
    font-family:"Courier New",Courier,monospace;
    font-size:10.5px; letter-spacing:.03em; line-height:1.25;
    cursor:pointer; user-select:none;
    transition:box-shadow .15s;
  }
  .card.i-card{background:#fff; color:#000; border:1px solid #000;}
  .card.i-card:hover{background:#e4e4e4;}
  .card.o-card{background:#000; color:#fff; border:1.6px dotted #fff;}
  .card.o-card:hover{background:#141414;}
  .card.o-card.kalma-on, .card.i-card.kalma-on{animation:pulseGlow 2.2s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{opacity:.8;} 50%{opacity:1;}}

  .card.locked-card{background:#000; color:var(--dimmer); border:1px solid var(--dimmer); font-size:9px;}
  .card.available-card{background:#000; color:var(--fg); border:1px solid var(--fg); animation:ringPulse 1.6s ease-in-out infinite;}
  @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0);} 50%{box-shadow:0 0 10px 1px rgba(255,255,255,.35);}}

  .card.null-card{background:#000; color:var(--grn); border:1px solid var(--grn); font-family:"Times New Roman",serif; font-size:16px; letter-spacing:.1em;}
  .card.null-card.dormant{color:var(--dim); border-color:var(--dimmer); font-family:"Courier New",monospace; font-size:10px; animation:ringPulse 1.6s ease-in-out infinite;}
  .card.null-card.active{animation:pulseGlow 1.8s ease-in-out infinite; box-shadow:0 0 16px 2px rgba(124,255,176,.3);}

  .card.selected{outline:2px solid var(--cyan); outline-offset:2px;}

  .tier-tag{position:absolute; font-size:8px; letter-spacing:.12em; color:var(--dimmer); pointer-events:none;}

  /* ===== BOTTOM HUD ===== */
  .hud-bottom{
    position:relative; z-index:3;
    border-top:1px solid #161616;
    background:rgba(0,0,0,.75);
  }
  .readout-row{
    display:flex; align-items:stretch; flex-wrap:wrap;
    border-bottom:1px solid #161616;
  }
  .readout-cell{padding:10px 16px; border-right:1px solid #161616; font-size:10px; color:var(--dim); letter-spacing:.08em;}
  .readout-cell b{display:block; font-family:"Times New Roman",serif; font-size:20px; color:var(--fg); letter-spacing:.02em; font-weight:normal;}
  .readout-cell.grow{flex:1; min-width:180px;}
  .tickrow{display:flex; gap:4px; margin-top:6px; flex-wrap:wrap;}
  .tick{width:11px;height:11px;border:1px solid var(--dimmer);}
  .tick.available{border-color:var(--fg); animation:ringPulse2 1.6s infinite;}
  .tick.carved{background:var(--fg); border-color:var(--fg);}
  @keyframes ringPulse2{0%,100%{opacity:.5;}50%{opacity:1;}}

  .controls-row{display:flex; gap:8px; padding:10px 16px; flex-wrap:wrap; align-items:center; border-bottom:1px solid #161616;}
  .controls-row button{
    background:transparent; border:1px solid var(--line); color:var(--fg);
    font-family:"Courier New",monospace; font-size:10.5px; padding:6px 12px; cursor:pointer;
  }
  .controls-row button:hover{background:var(--fg); color:#000;}
  .controls-row input[type=number]{
    width:56px; background:#000; border:1px solid var(--line); color:var(--fg);
    font-family:"Courier New",monospace; padding:6px; font-size:10.5px;
  }
  .controls-row .spacer{flex:1;}
  .controls-row .reset{color:var(--dim); border-color:#222;}

  .infopanel{padding:14px 16px 18px; min-height:96px;}
  .infopanel .eyebrow{font-size:9px; letter-spacing:.18em; color:var(--dimmer);}
  .infopanel .name{font-family:"Times New Roman",serif; font-size:18px; margin:4px 0 8px;}
  .infopanel .name.kalma-c{color:var(--grn);}
  .infopanel .row{display:flex; gap:8px; font-size:11px; margin-bottom:4px; max-width:60ch;}
  .infopanel .tag{font-size:9px; border:1px solid var(--dimmer); padding:0 4px; color:var(--dim); flex-shrink:0;}
  .infopanel .tag.o{border-color:var(--amber); color:var(--amber);}
  .infopanel .loss{margin-top:8px; font-size:10px; color:var(--cyan); font-style:italic;}
  .infopanel .fire-row{margin-top:10px; display:flex; gap:8px;}
  .infopanel .fire-row button{
    background:transparent; border:1px solid var(--line); color:var(--fg);
    font-family:"Courier New",monospace; font-size:10px; padding:6px 12px; cursor:pointer;
  }
  .infopanel .fire-row button:hover{background:var(--fg); color:#000;}
  .infopanel .fire-row button.carve{border-color:var(--amber); color:var(--amber); animation:ringPulse2 1.6s infinite;}
  .infopanel .fire-row button.carve:hover{background:var(--amber); color:#000;}
  .infopanel .fire-row button.activate{border-color:var(--grn); color:var(--grn); animation:ringPulse2 1.6s infinite;}
  .infopanel .fire-row button.activate:hover{background:var(--grn); color:#000;}

  .log-feed{font-size:9.5px; line-height:1.6; max-height:110px; overflow-y:auto; color:var(--dim); padding:10px 16px 14px; border-top:1px solid #161616;}
  .log-feed div{white-space:pre-wrap;}
  .log-feed .hit{color:var(--fg);}
  .log-feed .kalma-hit{color:var(--grn);}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:1000; align-items:center; justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{border:1px solid var(--fg); background:#000; padding:20px; width:min(90vw,420px);}
  .modal h3{font-family:"Times New Roman",serif; font-size:14px; letter-spacing:2px; margin:0 0 6px;}
  .modal p{font-size:10.5px; color:var(--dim); margin:0 0 12px;}
  .modal textarea{width:100%; background:#000; border:1px solid var(--line); color:var(--fg);
    font-family:"Courier New",monospace; font-size:11.5px; padding:8px; min-height:68px; resize:vertical;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:12px;}
  .modal-actions button{background:transparent; border:1px solid var(--line); color:var(--fg);
    font-family:"Courier New",monospace; padding:6px 13px; font-size:10.5px; cursor:pointer;}
  .modal-actions button:hover{background:var(--fg); color:#000;}

  @media(max-width:640px){
    .hud-title{font-size:12px; letter-spacing:.2em;}
    .readout-cell b{font-size:16px;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="dust" id="dust"></div>

  <div class="hud-top">
    <span>KEPT <b>//</b> NOTCH FIELD</span>
    <span class="hud-title">OTHERGRADE</span>
    <span>ID <b>OG-000</b></span>
  </div>

  <div class="field-wrap">
    <svg class="field" id="fieldSvg" viewBox="0 0 1400 920" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="hud-bottom">
    <div class="readout-row">
      <div class="readout-cell">
        NOISE
        <b id="noiseVal">0</b>
      </div>
      <div class="readout-cell grow">
        NOTCHES <span id="notchFrac">0/9</span>
        <div class="tickrow" id="tickRow"></div>
      </div>
      <div class="readout-cell" style="text-align:right;">
        STATUS<br><b id="statusVal" style="font-size:13px;">STABLE</b>
      </div>
    </div>

    <div class="controls-row">
      <button id="fixBtn">FIX (+5)</button>
      <input type="number" id="manualAmt" placeholder="±n" />
      <button id="manualBtn">APPLY</button>
      <div class="spacer"></div>
      <button class="reset" id="resetBtn">reset kept</button>
    </div>

    <div class="infopanel" id="infopanel">
      <div class="eyebrow">SELECTED</div>
      <div class="name">— no card selected —</div>
      <div class="row" style="color:var(--dimmer)">Click any card in the field above.</div>
    </div>

    <div class="log-feed" id="logFeed"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">CARVE NOTCH</h3>
    <p id="modalSub"></p>
    <textarea id="lossInput" placeholder="Describe the Loss — a missing memory, a hand that won't stop shaking, a name that means nothing anymore..."></textarea>
    <div class="modal-actions">
      <button id="modalCancel">cancel</button>
      <button id="modalConfirm">carve</button>
    </div>
  </div>
</div>

<script>
(async function(){

  const KINO = [
    {id:'lumen',  I:"Lumen",  Id:"fast, clean projectile",  O:"Tenebrae", Od:"larger, piercing, carries a Static side-effect", cost:2},
    {id:'awl',    I:"Awl",    Id:"refracted strike",        O:"Flense",   Od:"hits what isn't fully physical, bypasses armor", cost:2},
    {id:'wend',   I:"Wend",   Id:"brief, ignores minor obstacles", O:"Undertow", Od:"the whole path damages what's in it", cost:3},
    {id:'ward',   I:"Ward",   Id:"deflects",                 O:"Maw",     Od:"absorbs and swallows", cost:3},
    {id:'alight', I:"Alight", Id:"controlled landing",       O:"Founder", Od:"violent Static impact on landing", cost:2},
    {id:'psalm',  I:"Psalm",  Id:"straight up, clean",       O:"Dirge",   Od:"grows with your Notch count", cost:4}
  ];

  const THRESHOLDS = [
    {n:1, req:10,  power:"Fang",                  Id:"mirrors your movement",              Od:"unchained at Notch 6 — hunts on its own"},
    {n:2, req:25,  power:"Wing",                  Id:"attached, carries you aloft",        Od:"the shade drags you higher than you meant to go"},
    {n:3, req:45,  power:"Wrath",                 Id:"mirrors you, takes the hit for you", Od:"unchained at Notch 8 — learns from what strikes you"},
    {n:4, req:70,  power:"Edge",                  Id:"follows your attacks, clean severance", Od:"unchained at Notch 7 — severs matter, Static, connections outright"},
    {n:5, req:100, power:"Zero Parade",            Id:"a handful of black rabbits, skittish", Od:"unchained at Notch 9 — the swarm moves as one, past counting"},
    {n:6, req:135, power:"Fang, unchained",        Id:"hunts independently, still answers to you", Od:"hunts on instinct alone"},
    {n:7, req:175, power:"Disaster Blade",         Id:"severs matter and Static cleanly",   Od:"severs connections outright"},
    {n:8, req:220, power:"Wrath, unchained",       Id:"acts independently, still yours",    Od:"learns from every hit, keeps the lesson"},
    {n:9, req:270, power:"Zero Parade, unchained", Id:"the swarm moves as one body",        Od:"multiplies past counting"}
  ];
  const NULL_NOTCH = {power:"Null", Od:"the Shade at full, unfiltered output — nothing left to argue with the noise"};
  const MAX_NOISE = 270;
  const STORE_KEY = "othergrade-starfield-v2";

  let state = {
    noise:0, kalmaActive:false,
    notches: THRESHOLDS.map(()=>({carved:false, loss:""})),
    log: []
  };
  let selected = null; // {kind:'kino'|'fantom'|'null', idx}

  async function loadState(){
    try{
      const res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.notches) && parsed.notches.length===THRESHOLDS.length){
          state = parsed;
        }
      }
    }catch(e){}
  }
  async function saveState(){
    try{ await window.storage.set(STORE_KEY, JSON.stringify(state), false); }catch(e){}
  }

  function isKalma(){ return !!state.kalmaActive; }
  function carvedCount(){ return state.notches.filter(n=>n.carved).length; }
  function allCarved(){ return carvedCount() === THRESHOLDS.length; }

  function pushLog(text, cls){
    const stamp = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    state.log.unshift({text:`[${stamp}] ${text}`, cls:cls||""});
    state.log = state.log.slice(0,30);
  }
  function addNoise(amount, label){
    if(isKalma() && amount>0){
      pushLog(`${label} — no Noise (Kalma).`, "kalma-hit");
      renderAll(); saveState(); return;
    }
    state.noise = Math.max(0, Math.min(MAX_NOISE, state.noise+amount));
    pushLog(`${label} — Noise ${amount>=0?'+':''}${amount} (now ${state.noise})`, amount>0?"hit":"");
    renderAll(); saveState();
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  // ---------- hand-placed layout — no hub, no rings, no radial arrangement ----------
  // each entry: pair-center {x,y}. I-card sits left half, O-card sits right half.
  const KINO_POS = [
    {x:140,  y:110},
    {x:430,  y:80},
    {x:740,  y:130},
    {x:1040, y:90},
    {x:250,  y:260},
    {x:640,  y:240}
  ];
  const FANTOM_POS = [
    {x:120,  y:430},
    {x:400,  y:390},
    {x:660,  y:450},
    {x:930,  y:400},
    {x:1200, y:460},
    {x:260,  y:600},
    {x:540,  y:650},
    {x:830,  y:630},
    {x:1100, y:670}
  ];
  const NULL_POS = {x:700, y:830};

  const PAIR_W = 150, PAIR_H = 66, GAP = 8;      // Kino / carved-Fantom binary cards
  const SINGLE_W = 140, SINGLE_H = 60;            // Fantom locked / available single card
  const NULL_W = 240, NULL_H = 96;

  const svg = document.getElementById('fieldSvg');
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  // a box rendered as a foreignObject containing an HTML div, so text can wrap and fit inside
  function box(cx, cy, w, h, innerHtml, cls, onClick){
    const fo = el('foreignObject', {x:cx-w/2, y:cy-h/2, width:w, height:h});
    const div = document.createElement('div');
    div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
    div.className = 'card '+cls;
    div.innerHTML = innerHtml;
    if(onClick) div.addEventListener('click', onClick);
    fo.appendChild(div);
    return fo;
  }

  function renderField(){
    svg.innerHTML = "";

    // ---- Kino pairs ----
    KINO.forEach((k,i)=>{
      const p = KINO_POS[i];
      const ix = p.x - PAIR_W/2 - GAP/2 + (PAIR_W/2)/2*0; // left card center
      const iCx = p.x - (PAIR_W+GAP)/4 - GAP/4;
      const oCx = p.x + (PAIR_W+GAP)/4 + GAP/4;
      const halfW = PAIR_W/2;

      svg.appendChild(el('line',{x1:p.x-halfW/2,y1:p.y,x2:p.x+halfW/2,y2:p.y,class:'lead'}));
      if(i>0){
        const prev = KINO_POS[i-1];
        svg.appendChild(el('line',{x1:prev.x,y1:prev.y,x2:p.x,y2:p.y,class:'lead link'+(true?' lit':'')}));
      }

      const iSel = selected && selected.kind==='kino' && selected.idx===i && selected.side==='I' ? ' selected':'';
      const oSel = selected && selected.kind==='kino' && selected.idx===i && selected.side==='O' ? ' selected':'';

      svg.appendChild(box(p.x-halfW/2, p.y, halfW-GAP/2, PAIR_H,
        `<b>${k.I}</b><br>${k.Id}`, 'i-card'+(isKalma()?' kalma-on':'')+iSel,
        ()=>selectKino(i,'I')));
      svg.appendChild(box(p.x+halfW/2, p.y, halfW-GAP/2, PAIR_H,
        `<b>${k.O}</b><br>${k.Od}`, 'o-card'+(isKalma()?' kalma-on':'')+oSel,
        ()=>selectKino(i,'O')));
    });

    // link last Kino to first Fantom to keep one continuous constellation line
    svg.appendChild(el('line',{x1:KINO_POS[KINO_POS.length-1].x,y1:KINO_POS[KINO_POS.length-1].y,
      x2:FANTOM_POS[0].x,y2:FANTOM_POS[0].y,class:'lead link'}));

    // ---- Fantom ----
    THRESHOLDS.forEach((t,i)=>{
      const p = FANTOM_POS[i];
      const entry = state.notches[i];
      const available = !entry.carved && state.noise >= t.req;

      if(i>0){
        const prev = FANTOM_POS[i-1];
        const prevCarved = state.notches[i-1].carved;
        svg.appendChild(el('line',{x1:prev.x,y1:prev.y,x2:p.x,y2:p.y,class:'lead link'+(prevCarved?' lit':'')}));
      }

      if(entry.carved){
        const halfW = PAIR_W/2;
        const iSel = selected && selected.kind==='fantom' && selected.idx===i && selected.side==='I' ? ' selected':'';
        const oSel = selected && selected.kind==='fantom' && selected.idx===i && selected.side==='O' ? ' selected':'';

        svg.appendChild(el('line',{x1:p.x-halfW/2,y1:p.y,x2:p.x+halfW/2,y2:p.y,class:'lead lit'}));

        svg.appendChild(box(p.x-halfW/2, p.y, halfW-GAP/2, PAIR_H,
          `<b>N${t.n} · ${t.power}</b><br>${t.Id}`, 'i-card'+(isKalma()?' kalma-on':'')+iSel,
          ()=>selectFantom(i,'I')));
        svg.appendChild(box(p.x+halfW/2, p.y, halfW-GAP/2, PAIR_H,
          `<b>shade read</b><br>${t.Od}`, 'o-card'+(isKalma()?' kalma-on':'')+oSel,
          ()=>selectFantom(i,'O')));
      } else if(available){
        const sel = selected && selected.kind==='fantom' && selected.idx===i ? ' selected':'';
        svg.appendChild(box(p.x, p.y, SINGLE_W, SINGLE_H,
          `<b>N${t.n} · ${t.power}</b><br>threshold reached — carve?`, 'available-card'+sel,
          ()=>selectFantom(i,null)));
      } else {
        const sel = selected && selected.kind==='fantom' && selected.idx===i ? ' selected':'';
        svg.appendChild(box(p.x, p.y, SINGLE_W*0.6, SINGLE_H*0.72,
          `N${t.n}<br>?????`, 'locked-card'+sel,
          ()=>selectFantom(i,null)));
      }
    });

    // ---- Null / Kalma ----
    if(allCarved()){
      const last = FANTOM_POS[FANTOM_POS.length-1];
      svg.appendChild(el('line',{x1:last.x,y1:last.y,x2:NULL_POS.x,y2:NULL_POS.y,
        class:isKalma()?'lead kalma-lead':'lead dashed'}));

      const sel = selected && selected.kind==='null' ? ' selected':'';
      if(isKalma()){
        svg.appendChild(box(NULL_POS.x, NULL_POS.y, NULL_W, NULL_H,
          `KALMA — NULL`, 'null-card active'+sel, ()=>selectNull()));
      } else {
        svg.appendChild(box(NULL_POS.x, NULL_POS.y, NULL_W*0.8, NULL_H*0.8,
          `KALMA<br>all Notches carved — activate?`, 'null-card dormant'+sel, ()=>selectNull()));
      }
    }
  }

  // ---------- selection & info panel ----------
  function selectKino(i, side){ selected = {kind:'kino', idx:i, side}; renderAll(); }
  function selectFantom(i, side){ selected = {kind:'fantom', idx:i, side}; renderAll(); }
  function selectNull(){ selected = {kind:'null'}; renderAll(); }

  function renderInfo(){
    const panel = document.getElementById('infopanel');
    if(!selected){
      panel.innerHTML = `<div class="eyebrow">SELECTED</div><div class="name">— no card selected —</div>
        <div class="row" style="color:var(--dimmer)">Click any card in the field above.</div>`;
      return;
    }
    if(selected.kind==='kino'){
      const k = KINO[selected.idx];
      panel.innerHTML = `<div class="eyebrow">KINO — BASELINE</div>
        <div class="name">${k.I} / ${k.O}</div>
        <div class="row"><span class="tag">I</span><span>${k.Id}</span></div>
        <div class="row"><span class="tag o">O</span><span>${k.Od} ${isKalma()?'— continuous, no Noise':`(+${k.cost} Noise)`}</span></div>
        <div class="fire-row">
          <button id="fireI">FIRE I</button>
          <button id="fireO">FIRE O</button>
        </div>`;
      document.getElementById('fireI').addEventListener('click', ()=>{ pushLog(`${k.I} used — clean, no Noise.`); renderAll(); saveState(); });
      document.getElementById('fireO').addEventListener('click', ()=>{ addNoise(isKalma()?0:k.cost, `${k.O} fired`); });
      return;
    }
    if(selected.kind==='fantom'){
      const t = THRESHOLDS[selected.idx];
      const entry = state.notches[selected.idx];
      const available = !entry.carved && state.noise >= t.req;
      if(entry.carved){
        panel.innerHTML = `<div class="eyebrow">FANTOM — N${t.n}</div>
          <div class="name">${t.power}</div>
          <div class="row"><span class="tag">I</span><span>${t.Id}</span></div>
          <div class="row"><span class="tag o">O</span><span>${t.Od} ${isKalma()?'— continuous, no Noise':'(+3 Noise)'}</span></div>
          <div class="loss">Loss: ${escapeHtml(entry.loss)}</div>
          <div class="fire-row">
            <button id="fireI">FIRE I</button>
            <button id="fireO">FIRE O</button>
          </div>`;
        document.getElementById('fireI').addEventListener('click', ()=>{ addNoise(isKalma()?0:3, `${t.power} used — light read`); });
        document.getElementById('fireO').addEventListener('click', ()=>{ addNoise(isKalma()?0:3, `${t.power} used — shade read`); });
      } else if(available){
        panel.innerHTML = `<div class="eyebrow">FANTOM — N${t.n}</div>
          <div class="name">${t.power}</div>
          <div class="row">Threshold ${t.req} reached. Crossing it only unlocked the option — carving is your choice, and it costs a permanent Loss.</div>
          <div class="fire-row"><button class="carve" id="carveBtn">CARVE →</button></div>`;
        document.getElementById('carveBtn').addEventListener('click', ()=>openCarveModal(selected.idx));
      } else {
        panel.innerHTML = `<div class="eyebrow">FANTOM — N${t.n}</div>
          <div class="name" style="color:var(--dimmer)">UNIDENTIFIED CONTACT</div>
          <div class="row" style="color:var(--dimmer)">Dormant. Carves automatically at ${t.req} running Noise.</div>`;
      }
      return;
    }
    if(selected.kind==='null'){
      if(isKalma()){
        panel.innerHTML = `<div class="eyebrow">KALMA</div>
          <div class="name kalma-c">NULL</div>
          <div class="row">${NULL_NOTCH.Od}</div>
          <div class="row" style="color:var(--dim)">Every Kino and Fantom O side now runs continuous, free of Noise.</div>`;
      } else {
        panel.innerHTML = `<div class="eyebrow">KALMA</div>
          <div class="name">All ${THRESHOLDS.length} Notches carved</div>
          <div class="row">Nothing left to carve. What's left is a choice: become what you've been carving toward.</div>
          <div class="fire-row"><button class="activate" id="activateBtn">ACTIVATE →</button></div>`;
        document.getElementById('activateBtn').addEventListener('click', activateKalma);
      }
    }
  }

  function activateKalma(){
    state.kalmaActive = true;
    pushLog(`KALMA ACTIVATED — all ${THRESHOLDS.length} Notches carved. Every O side now runs continuous.`, "kalma-hit");
    selected = {kind:'null'};
    renderAll(); saveState();
  }

  function openCarveModal(i){
    const t = THRESHOLDS[i];
    document.getElementById('modalTitle').textContent = `CARVE NOTCH ${t.n} — ${t.power.toUpperCase()}`;
    document.getElementById('modalSub').textContent = `Threshold ${t.req} reached. Carving is deliberate, and it costs a permanent Loss.`;
    document.getElementById('lossInput').value = "";
    document.getElementById('modalBg').classList.add('show');
    document.getElementById('lossInput').focus();
    document.getElementById('modalConfirm').onclick = ()=>{
      const val = document.getElementById('lossInput').value.trim();
      state.notches[i].carved = true;
      state.notches[i].loss = val || "(unspecified)";
      pushLog(`NOTCH ${t.n} CARVED — ${t.power}. Loss: ${state.notches[i].loss}`, "hit");
      document.getElementById('modalBg').classList.remove('show');
      selected = {kind:'fantom', idx:i, side:'I'};
      renderAll(); saveState();
    };
  }
  document.getElementById('modalCancel').addEventListener('click', ()=>document.getElementById('modalBg').classList.remove('show'));
  document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') document.getElementById('modalBg').classList.remove('show'); });

  // ---------- HUD readouts ----------
  function renderHud(){
    document.getElementById('noiseVal').textContent = state.noise;
    document.getElementById('notchFrac').textContent = `${carvedCount()}/${THRESHOLDS.length}`;
    document.getElementById('statusVal').textContent = isKalma() ? 'KALMA — NULL' : 'STABLE';
    document.getElementById('statusVal').style.color = isKalma() ? 'var(--grn)' : 'var(--fg)';

    const track = document.getElementById('tickRow');
    track.innerHTML = THRESHOLDS.map((t,i)=>{
      const entry = state.notches[i];
      const cls = entry.carved ? 'carved' : (state.noise>=t.req ? 'available' : '');
      return `<div class="tick ${cls}" title="N${t.n} ${t.power}"></div>`;
    }).join('');
  }

  function renderLog(){
    const feed = document.getElementById('logFeed');
    if(state.log.length===0){ feed.innerHTML = `<div>— no activity logged yet —</div>`; return; }
    feed.innerHTML = state.log.map(l=>`<div class="${l.cls}">${escapeHtml(l.text)}</div>`).join('');
  }

  function renderAll(){
    renderField();
    renderHud();
    renderInfo();
    renderLog();
  }

  document.getElementById('fixBtn').addEventListener('click', ()=>{
    addNoise(isKalma()?0:5, isKalma() ? 'Fix — no Noise (Kalma)' : 'Fix invoked');
  });
  document.getElementById('manualBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('manualAmt');
    const v = parseInt(inp.value);
    if(!isNaN(v) && v!==0){ addNoise(v, 'Manual adjustment'); inp.value=''; }
  });
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(confirm('Reset this Kept? Noise, Notches, and Losses will be cleared permanently.')){
      state = { noise:0, kalmaActive:false, notches: THRESHOLDS.map(()=>({carved:false, loss:""})), log:[] };
      selected = null;
      pushLog('Kept reset.');
      renderAll(); await saveState();
    }
  });

  // ---------- ambient star dust ----------
  function buildDust(){
    const wrap = document.getElementById('dust');
    const frag = document.createDocumentFragment();
    for(let i=0;i<160;i++){
      const s = document.createElement('i');
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*100)+'%';
      s.style.setProperty('--dur', (2+Math.random()*4).toFixed(2)+'s');
      s.style.setProperty('--delay', (Math.random()*4).toFixed(2)+'s');
      frag.appendChild(s);
    }
    wrap.appendChild(frag);
  }

  buildDust();
  await loadState();
  if(state.log.length===0) pushLog('Kept status channel online.');
  renderAll();

})();
</script>
</body>
</html>
